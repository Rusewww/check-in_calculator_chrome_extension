name: Refresh airport dataset

on:
  schedule:
    - cron: '0 6 1 * *' # 06:00 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:build
      - run: npm test -- tests/data
      - run: npm run build:icons
      - uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore: refresh airport dataset'
          title: 'chore: refresh airport dataset'
          body: Automated monthly rebuild of `public/data/airports.json` from OurAirports and mwgg/Airports.
          branch: chore/refresh-airports
          add-paths: public/data/
